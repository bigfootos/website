# =============================================================================
# 10ft Website — GitLab CI/CD Pipeline
# =============================================================================
# Static site (no build step) published to GitLab Pages from `site/`.
#
# The Pages site must use a NON-unique domain so it is served from the group
# Pages domain (https://10ft.pages.sector64.net/website/), like `10ft/flatpaks`.
# That is a project setting (Deploy > Pages > "Use unique domain": off), not a
# CI keyword. All URLs in `site/` are relative so the path prefix works.
# =============================================================================

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true
  tags:
    - docker

stages:
  - test
  - deploy

check:site:
  stage: test
  image: docker.io/library/python:3-alpine
  script:
    - python3 scripts/check-site.py

pages:
  stage: deploy
  image: docker.io/library/alpine:latest
  resource_group: website-pages
  needs:
    - job: check:site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - mkdir -p public
    - cp -r site/. public/
    - echo "GitLab Pages URL ${CI_PAGES_URL:-https://10ft.pages.sector64.net/website}"
  artifacts:
    paths:
      - public

docker:
  stage: deploy
  image: docker.io/library/docker:latest
  script:
    - docker build -t git.sektor64.net/10ft/website .
    - echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY
    - docker push git.sektor64.net/10ft/website:latest