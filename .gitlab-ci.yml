# =============================================================================
# Bigfoot Website — GitLab CI/CD Pipeline
# =============================================================================
# Static site published to GitLab Pages and the container registry from `site/`.
# Derived WebP screenshots and favicon PNGs are rendered in CI by
# `scripts/build-assets.sh` so swapping source SVGs/PNGs never leaves stale
# assets behind.
#
# The Pages site must use a NON-unique domain so it is served from the group
# Pages domain (https://bigfoot.pages.sector64.net/website/), like `bigfoot/flatpaks`.
# That is a project setting (Deploy > Pages > "Use unique domain": off), not a
# CI keyword. All URLs in `site/` are relative so the path prefix works.
# =============================================================================

include:
  - component: $CI_SERVER_FQDN/bigfoot/ci-components/gitleaks@main

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true
  tags:
    - docker

stages:
  - lint
  - build
  - test
  - deploy

build:assets:
  stage: build
  image: docker.io/library/alpine:latest
  before_script:
    - apk add --no-cache libwebp-tools rsvg-convert
  script:
    - sh scripts/build-assets.sh
  artifacts:
    paths:
      - site/favicon.svg
      - site/favicon-48x48.png
      - site/apple-touch-icon.png
      - site/assets/img/*.png
      - site/assets/img/*.webp
    expire_in: 1 day

check:site:
  stage: test
  image: docker.io/library/python:3-alpine
  needs:
    - job: build:assets
      artifacts: true
  script:
    - python3 scripts/check-site.py

check:w3c:
  stage: test
  image:
    name: ghcr.io/validator/validator:latest
    entrypoint: [""]
  needs:
    - job: build:assets
      artifacts: true
  script:
    - vnu --version
    - find site -type f \( -name '*.html' -o -name '*.htm' -o -name '*.xhtml' -o -name '*.css' -o -name '*.svg' \) -print0 | xargs -0 vnu --verbose --also-check-css --also-check-svg

pages:
  stage: deploy
  image: docker.io/library/alpine:latest
  resource_group: website-pages
  needs:
    - job: lint:gitleaks
      artifacts: false
    - job: build:assets
      artifacts: true
    - job: check:site
      artifacts: false
    - job: check:w3c
      artifacts: false
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - mkdir -p public
    - cp -r site/. public/
    - echo "GitLab Pages URL ${CI_PAGES_URL:-https://bigfoot.pages.sector64.net/website}"
  artifacts:
    paths:
      - public

docker:
  stage: deploy
  image: quay.io/buildah/stable
  needs:
    - job: lint:gitleaks
      artifacts: false
    - job: check:site
      artifacts: false
    - job: check:w3c
      artifacts: false
  script:
    - buildah build -t git.sektor64.net:5005/bigfoot/website:latest .
    - echo "${CI_REGISTRY_PASSWORD}" | buildah login -u "${CI_REGISTRY_USER}" --password-stdin "git.sektor64.net:5005"
    - buildah push git.sektor64.net:5005/bigfoot/website:latest
