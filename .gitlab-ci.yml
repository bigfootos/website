# =============================================================================
# Bigfoot Website — GitLab CI/CD Pipeline
# =============================================================================
# Static site (no build step) published to GitLab Pages from `site/`.
#
# The Pages site must use a NON-unique domain so it is served from the group
# Pages domain (https://bigfoot.pages.sector64.net/website/), like `bigfoot/flatpaks`.
# That is a project setting (Deploy > Pages > "Use unique domain": off), not a
# CI keyword. All URLs in `site/` are relative so the path prefix works.
# =============================================================================

include:
  - component: $CI_SERVER_FQDN/bigfoot/ci-components/gitleaks@main

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

default:
  interruptible: true
  tags:
    - docker

stages:
  - lint
  - test
  - deploy

check:site:
  stage: test
  image: docker.io/library/python:3-alpine
  script:
    - python3 scripts/check-site.py

pages:
  stage: deploy
  image: docker.io/library/alpine:latest
  resource_group: website-pages
  needs:
    - job: lint:gitleaks
      artifacts: false
    - job: check:site
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - mkdir -p public
    - cp -r site/. public/
    - echo "GitLab Pages URL ${CI_PAGES_URL:-https://bigfoot.pages.sector64.net/website}"
  artifacts:
    paths:
      - public

docker:
  stage: deploy
  image: quay.io/buildah/stable
  script:
    - buildah build -t git.sektor64.net:5005/bigfoot/website:latest .
    - echo "${CI_REGISTRY_PASSWORD}" | buildah login -u "${CI_REGISTRY_USER}" --password-stdin "git.sektor64.net:5005"
    - buildah push git.sektor64.net:5005/bigfoot/website:latest
